<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semakan Jawapan — Data Foundation &amp; Data Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#123330;
    --canvas-2:#0e2a27;
    --paper:#fbf7ed;
    --paper-2:#f3edda;
    --ink:#1b2624;
    --ink-soft:#5b6d68;
    --ink-faint:#8a978f;
    --teal:#1c7a70;
    --teal-dark:#125650;
    --red-pen:#b23b2e;
    --red-pen-bg:#f7e4df;
    --green-pen:#2f7d4f;
    --green-pen-bg:#e3f1e6;
    --gold:#c99a3e;
    --line:#e4dcc5;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card:0 18px 40px -18px rgba(6,20,18,.45);
    --shadow-soft:0 8px 22px -12px rgba(6,20,18,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, #17433f 0%, transparent 45%),
      radial-gradient(circle at 88% 92%, #0f2f2b 0%, transparent 40%),
      var(--canvas);
    min-height:100vh;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  #app{
    max-width:760px;
    margin:0 auto;
    padding:32px 18px 64px;
    min-height:100vh;
  }
  a,button{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;font-size:inherit;color:inherit;}
  ::selection{background:var(--gold);color:var(--ink);}

  /* ---------- top brand ---------- */
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
    color:#eef4f2;
  }
  .brand .stamp-mini{
    width:44px;height:44px;border-radius:50%;
    border:2px solid rgba(238,244,242,.55);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;font-size:.8rem;
    letter-spacing:.02em;
    transform:rotate(-8deg);
    flex-shrink:0;
  }
  .brand-text .eyebrow{
    font-family:'JetBrains Mono';font-size:.68rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold);margin:0 0 2px;
  }
  .brand-text h1{font-size:1.32rem;margin:0;color:#fff;font-weight:700;line-height:1.15;}

  /* ---------- home screen ---------- */
  .home-intro{
    color:#dce9e5;
    font-size:.98rem;
    line-height:1.6;
    max-width:56ch;
    margin:0 0 28px;
  }
  .set-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:560px){ .set-grid{grid-template-columns:1fr;} }

  .set-card{
    position:relative;
    background:var(--paper);
    border-radius:var(--radius-lg);
    padding:22px 20px 20px;
    box-shadow:var(--shadow-card);
    border:1px solid rgba(0,0,0,.03);
    text-align:left;
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .set-card::before{
    content:"";
    position:absolute; top:0; left:22px; right:22px; height:10px;
    background:repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,.06) 8px 9px);
    opacity:.6;
  }
  .set-card:hover{ transform:translateY(-3px); box-shadow:0 24px 46px -16px rgba(6,20,18,.5); }
  .set-card .cat{
    font-family:'JetBrains Mono'; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal-dark); font-weight:700;
  }
  .set-card h3{ margin:0; font-size:1.28rem; color:var(--ink); }
  .set-card .count{ font-size:.85rem; color:var(--ink-soft); }
  .set-card .go-btn{
    margin-top:8px;
    align-self:flex-start;
    background:var(--teal);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-weight:600;
    font-size:.88rem;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .15s ease, transform .12s ease;
  }
  .set-card .go-btn:hover{ background:var(--teal-dark); transform:translateX(2px); }
  .set-card.foundation .cat{color:#8a5a1f;}
  .set-card.foundation .go-btn{background:#a9772c;}
  .set-card.foundation .go-btn:hover{background:#8a5f22;}

  /* ---------- quiz top bar ---------- */
  .quiz-top{
    display:flex; align-items:center; gap:14px; margin-bottom:18px;
  }
  .back-link{
    color:#dce9e5; font-size:.85rem; display:flex; align-items:center; gap:5px;
    opacity:.85; flex-shrink:0;
  }
  .back-link:hover{opacity:1;}
  .progress-wrap{ flex:1; }
  .progress-label{
    display:flex; justify-content:space-between; color:#dce9e5; font-size:.78rem;
    font-family:'JetBrains Mono'; margin-bottom:5px; letter-spacing:.02em;
  }
  .progress-track{
    height:8px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--gold),#e4bd6e); border-radius:999px;
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  .score-badge{
    font-family:'JetBrains Mono'; font-weight:700; font-size:.82rem;
    background:rgba(255,255,255,.12); color:#fff; padding:7px 12px; border-radius:10px;
    flex-shrink:0; border:1px solid rgba(255,255,255,.18);
  }

  /* ---------- question card ---------- */
  .q-card{
    background:var(--paper);
    border-radius:var(--radius-lg);
    padding:26px 24px 22px;
    box-shadow:var(--shadow-card);
    animation:cardIn .32s cubic-bezier(.16,1,.3,1);
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .q-text{
    font-size:1.18rem; line-height:1.5; font-weight:600; color:var(--ink); margin:0 0 20px;
  }
  .q-text br{content:""; display:block; margin:4px 0;}

  .q-table-wrap{overflow-x:auto; margin:12px 0 4px; border-radius:10px; border:1px solid var(--line);}
  table.q-table{ border-collapse:collapse; width:100%; font-size:.78rem; font-family:'JetBrains Mono';}
  table.q-table th, table.q-table td{ padding:6px 9px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  table.q-table th{ background:var(--paper-2); font-weight:700; }
  table.q-table tr:last-child td{border-bottom:none;}

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex; align-items:center; gap:13px;
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-md);
    padding:13px 15px; text-align:left; font-size:1rem; color:var(--ink);
    transition:border-color .12s ease, background .12s ease, transform .1s ease;
    width:100%;
  }
  .opt:hover:not(.locked){ border-color:var(--teal); background:#f4faf9; }
  .opt .letter{
    width:30px;height:30px;border-radius:50%;
    background:var(--paper-2); border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono'; font-weight:700; font-size:.85rem; color:var(--ink-soft);
    flex-shrink:0; transition:all .15s ease;
  }
  .opt .otext{flex:1;}
  .opt.correct{ border-color:var(--green-pen); background:var(--green-pen-bg); }
  .opt.correct .letter{ background:var(--green-pen); color:#fff; border-color:var(--green-pen); }
  .opt.wrong{ border-color:var(--red-pen); background:var(--red-pen-bg); }
  .opt.wrong .letter{ background:var(--red-pen); color:#fff; border-color:var(--red-pen); }
  .opt.dim{ opacity:.55; }
  .opt.locked{ cursor:default; }
  .mark-icon{ margin-left:auto; font-weight:700; font-size:1.05rem; flex-shrink:0; }
  .opt.correct .mark-icon{ color:var(--green-pen); }
  .opt.wrong .mark-icon{ color:var(--red-pen); }

  .stamp-pop{ animation:stampIn .28s cubic-bezier(.34,1.56,.64,1); }
  @keyframes stampIn{ 0%{transform:scale(1.18) rotate(-3deg); opacity:.5;} 100%{transform:scale(1) rotate(0); opacity:1;} }

  .feedback-banner{
    margin-top:16px; padding:10px 14px; border-radius:10px; font-weight:700; font-size:.92rem;
    display:flex; align-items:center; gap:8px;
  }
  .feedback-banner.good{ background:var(--green-pen-bg); color:var(--green-pen); }
  .feedback-banner.bad{ background:var(--red-pen-bg); color:var(--red-pen); }

  .note{
    margin-top:14px; padding:14px 16px; border-radius:var(--radius-md);
    background:var(--paper-2); border:1.5px dashed var(--line);
    font-size:.93rem; line-height:1.55; color:#3a423f;
    transform:rotate(-.35deg);
    animation:noteIn .3s ease;
  }
  @keyframes noteIn{ from{opacity:0; transform:translateY(6px) rotate(-.35deg);} to{opacity:1; transform:translateY(0) rotate(-.35deg);} }
  .note .note-label{
    font-family:'JetBrains Mono'; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal-dark); font-weight:700; display:block; margin-bottom:5px;
  }

  .next-row{ display:flex; justify-content:flex-end; margin-top:20px; }
  .next-btn{
    background:var(--ink); color:#fbf7ed; padding:12px 22px; border-radius:12px;
    font-weight:600; font-size:.96rem; display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s ease, background .12s ease;
    animation:cardIn .25s ease;
  }
  .next-btn:hover{ background:var(--teal-dark); transform:translateX(2px); }

  /* ---------- results ---------- */
  .result-wrap{ text-align:center; padding-top:10px; }
  .stamp-big{
    width:172px; height:172px; border-radius:50%; margin:0 auto 22px;
    background:var(--paper);
    border:5px double var(--stampcolor, var(--teal));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-6deg);
    box-shadow:var(--shadow-card);
    animation:stampBig .45s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes stampBig{ 0%{transform:scale(.5) rotate(-6deg); opacity:0;} 100%{transform:scale(1) rotate(-6deg); opacity:1;} }
  .stamp-big .score-num{ font-family:'JetBrains Mono'; font-weight:700; font-size:2.1rem; color:var(--stampcolor,var(--teal)); line-height:1; }
  .stamp-big .score-den{ font-family:'JetBrains Mono'; font-size:.95rem; color:var(--ink-soft); margin-top:2px;}
  .stamp-big .score-pct{ font-family:'Space Grotesk'; font-weight:700; font-size:.82rem; color:var(--stampcolor,var(--teal)); margin-top:4px; letter-spacing:.03em;}

  .result-msg{ color:#fff; font-size:1.3rem; font-weight:700; margin:0 0 8px; }
  .result-sub{ color:#dce9e5; font-size:.95rem; margin:0 0 26px; }
  .result-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:30px; }
  .btn-solid{ background:var(--gold); color:#2a2011; padding:12px 20px; border-radius:12px; font-weight:700; font-size:.94rem; transition:transform .12s ease;}
  .btn-solid:hover{ transform:translateY(-2px); }
  .btn-ghost{ background:rgba(255,255,255,.1); color:#fff; padding:12px 20px; border-radius:12px; font-weight:600; font-size:.94rem; border:1.5px solid rgba(255,255,255,.3); transition:background .12s ease;}
  .btn-ghost:hover{ background:rgba(255,255,255,.2); }

  .review-toggle{
    color:#dce9e5; font-size:.86rem; text-decoration:underline; text-underline-offset:3px;
    margin-bottom:14px; display:inline-block;
  }
  .review-list{ text-align:left; display:flex; flex-direction:column; gap:12px; }
  .review-item{
    background:var(--paper); border-radius:var(--radius-md); padding:16px 18px;
    box-shadow:var(--shadow-soft);
  }
  .review-item .rq{ font-weight:600; font-size:.95rem; margin:0 0 8px; }
  .review-item .ra{ font-size:.85rem; margin:0 0 6px; }
  .review-item .ra.you{ color:var(--red-pen); }
  .review-item .ra.correct{ color:var(--green-pen); }
  .review-item .re{ font-size:.85rem; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:8px; margin-top:8px; }

  .footnote{
    color:#9db3ae; font-size:.72rem; text-align:center; margin-top:36px; line-height:1.6;
  }
  .kbd-hint{ display:none; }
  @media (min-width:640px){
    .kbd-hint{ display:inline; font-family:'JetBrains Mono'; font-size:.7rem; color:var(--ink-faint); margin-left:8px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA — 4 sets, extracted from the uploaded exam review PDF.
   Shorthand keys: q = question (HTML allowed), o = 4 options,
   c = index (0-3) of correct option, e = explanation.
   ========================================================= */

const foundationA = [
{q:"Which of the following best describes <b>Data Science</b>?",o:["The process of designing computer hardware systems","The practice of collecting, analyzing, and interpreting data to gain insights and support decision-making","The study of software programming languages only","The storage of large amounts of raw data without analysis"],c:1,e:"Data Science tu core-nya pasal collect, analyze, dan interpret data untuk dapat insight dan support decision-making — bukan sekadar hardware atau storage je."},
{q:"Identify the missing words: 'Probability theory is the branch of ___.'",o:["Statistics","Mathematics","Game and Gambling","Physics"],c:1,e:"Probability theory sebenarnya cabang Mathematics, walaupun ia banyak digunakan dalam Statistics."},
{q:"What are three of the five dysfunctions of a team?",o:["Inattention to result, Lack of creativity, Absence of trust","Lack of ambition, Avoidance of accountability, Lack of commitment","Lack of commitment, Fear of conflict, Lack of creativity","Lack of commitment, Absence of trust, Inattention to results"],c:3,e:"Ikut model Lencioni, lima dysfunctions tu: Absence of Trust, Fear of Conflict, Lack of Commitment, Avoidance of Accountability, Inattention to Results. Option D je yang ketiga-tiga item betul dari list ni. (Nota: bahagian 'correct answer' kat PDF sumber ter-cut off, so jawapan ni based on model asal — worth cross-check.)"},
{q:"In a fair coin, the probability of a tossed coin landing heads or tails is 0.5.<br>What is the probability of either head or tail (assuming that these events are mutually exclusive)?",o:["0.5","0.25","0.1","1"],c:3,e:"Head atau tail tu mutually exclusive dan cover SEMUA possible outcome, so P(head OR tail) = P(head) + P(tail) = 0.5 + 0.5 = 1."},
{q:"To which of the following organizations does the European Union General Data Protection Regulation (GDPR) <b>NOT</b> apply?",o:["Any European organization that processes data of American data subjects","Any American organization that processes data of American data subjects","Any American organization that processes data of EU data subjects","Any European organization that processes data of EU data subjects"],c:1,e:"GDPR fokus pada data subject yang berada di EU. Kalau organization DAN data subject dua-dua US-based, takde EU connection langsung — so GDPR tak apply."},
{q:"In what decade did ETL become a popular concept?",o:["1960s","1970s","1980s","1990s"],c:3,e:"ETL jadi popular concept dalam 1990-an, sejajar dengan perkembangan data warehousing masa tu."},
{q:"What is the main purpose of <b>data visualization</b> in Data Science?",o:["To increase data storage capacity","To hide sensitive information in datasets","To present data in a graphical format that makes patterns and insights easier to understand","To replace statistical analysis"],c:2,e:"Tujuan utama data viz adalah present data secara graphical supaya pattern dan insight senang nampak — bukan gantikan statistical analysis."},
{q:"Which of the following examples refers to <b>Veracity</b>?",o:["All credit card transactions on a day within Europe","Audio, video and text files that are generated at various locations in an organization","The quality and trustworthiness of data from a medical experiment","The usefulness of web-clicks info to improve your webshop and optimize profit"],c:2,e:"Veracity (salah satu 5 V's) pasal quality & trustworthiness data — macam data dari medical experiment yang kena betul-betul tepat."},
{q:"What are three Artificial Intelligence challenge fields?",o:["Machine Learning, Robotics & Automation, Knowledge Capture","Computer Vision, Planning and Optimization, Robotics & Automation","Machine Learning, Natural Language Recognition, Computer Vision","Natural Language Processing, Computer Vision, Robotics & Motion"],c:3,e:"Tiga challenge field utama AI: Natural Language Processing, Computer Vision, dan Robotics & Motion."},
{q:"Identify the missing words: 'For content management and indexing, a ___ would be the preferred NoSQL database type.'",o:["Document Store","Graph Database","Wide Column Store","Key/Value store"],c:0,e:"Document Store (contoh: MongoDB) sesuai untuk content management sebab simpan data dalam format flexible macam JSON, senang nak index."},
{q:"Identify the missing words: 'Machine learning ___ Artificial Intelligence.'",o:["is independent from","is a subset of","contains as subset","is the same as"],c:1,e:"Machine Learning adalah subset (sebahagian kecil) daripada Artificial Intelligence, bukan sebaliknya."},
{q:"Which TWO of the following statements BEST explain the importance of clear business objectives?<br><br>I. Without clear objectives, you are not able to close a project properly.<br>II. During the evaluation phase, you need business success criteria to evaluate your results.<br>III. If you define the business objective clearly, the client can not change the objective during the project.<br>IV. Business objectives are essential to determine the financial ROI of a data analysis.",o:["II & IV","II & III","I & II","I & III"],c:0,e:"Business objectives penting untuk (II) evaluate hasil guna success criteria, dan (IV) tentukan financial ROI — bukan untuk 'lock' objective supaya client tak boleh ubah langsung."},
{q:"Which is TWO of the following statements BEST describe the purpose of python and R languages for Data Science?<br><br>I. R is mainly used for statistical analysis<br>II. Python provides a more general approach to data science<br>III. R is a general purpose language with a readable syntax<br>IV. Python was built by statisticians and encompasses their specific language",o:["I & II","II & III","III & IV","I & IV"],c:0,e:"R memang kuat untuk statistical analysis, manakala Python bagi general-purpose approach yang lebih luas untuk data science."},
{q:"What are three types of output of visualisation?",o:["Strategic Dashboards, Matplotlib, PowerPoint","Strategic Dashboards, Operational Reports, Embedded Visualisations","Operational Reports, PowerPoint, MP4","Embedded Visualisations, Streamlit, Dash"],c:1,e:"Tiga jenis output visualization: Strategic Dashboards, Operational Reports, dan Embedded Visualisations — bukan nama tools macam Matplotlib/PowerPoint/Streamlit."},
{q:"What does Business Intelligence turn data into?",o:["Visualisations","Statistics","Business insights","PowerPoint presentations"],c:2,e:"Business Intelligence proses data untuk hasilkan business insights yang boleh guide decision-making."},
{q:"Which of the following is <b>TRUE</b> about train and test data?",o:["A portion of the whole dataset should be kept apart (test dataset) in the training process","The test data set size should be 80% of the whole data set, whereas the train data set should be 20%","Labels of the test set should not be known as they won't be part of the train process","Hyperparameter tuning should be carried out using only the test data set and not the train dataset"],c:0,e:"Standard practice: kena sisihkan sebahagian dataset jadi test set yang tak disentuh masa training, supaya evaluation model jadi fair."},
{q:"What are three of the four types of data analytics?",o:["Prescriptive, Diagnostic, Descriptive","Descriptive, Predictive, Reactive","Theoretical, Predictive, Diagnostic","Descriptive, Prescriptive, Prejudiced"],c:0,e:"Empat jenis data analytics: Descriptive, Diagnostic, Predictive, Prescriptive. 'Reactive' dan 'Theoretical' bukan kategori standard."},
{q:"Identify the missing words: 'A set of ___ associated with a random experiment is an ___.'",o:["events, item","items, event","items, sample space","sample spaces, item"],c:2,e:"Set kesemua possible outcome (items) dari satu random experiment dipanggil sample space."},
{q:"Which of the following is <b>NOT</b> a phase of the stages in the Data Science Lifecycle?",o:["Data preparation","Build model","Measure effectiveness","Anomaly detection"],c:3,e:"Anomaly detection tu satu teknik/method, bukan phase dalam Data Science Lifecycle — phase biasa termasuk Data Preparation, Build Model, Measure Effectiveness, Communicate Results. (Nota: 'correct answer' dalam PDF sumber ter-cut off — jawapan ni based on process of elimination.)"},
{q:"Why dealing with a large and growing variety of data structures is problematic for traditional databases?",o:["The fixed schema prevents loading and storing of an unknown data structure","It can't handle data structures, but only data schemas","Connecting to a traditional database is hard because of security constraints","Because of the differences in language and date/number formatting"],c:0,e:"Traditional database guna fixed schema, so dia tak boleh handle data structure yang unpredictable/berubah-ubah."},
{q:"Which of the following is an example of <b>structured data</b>?",o:["Images captured from CCTV cameras","Audio recordings from customer service calls","Data stored in rows and columns in a relational database","Social media posts and comments"],c:2,e:"Data dalam rows & columns (relational database) adalah contoh classic structured data — yang lain tu unstructured/semi-structured."},
{q:"Linear regression attempts to model the relationship between two variables by fitting a linear equation to observed data. The general equation is of the form Y = a + bX and are use several (X, Y) pairs, like (3, 5), to obtain a final equation of the form Y = 2 + 1*X.<br><br>Which of the following terms define best the general equation (Y = a + bX)?",o:["Algorithm","Training data","Model","Mathematical Logarithm"],c:2,e:"Bentuk umum Y = a + bX (sebelum nilai a,b spesifik ditentukan) tu dipanggil 'model' — struktur matematik yang representkan relationship antara variables. (Nota: 'correct answer' dalam PDF sumber ter-cut off — jawapan ni based on standard terminology, worth cross-check.)"},
{q:"Which of the following is <b>TRUE</b> about supervised learning in Machine Learning?",o:["It is carried out without pre-existing labels","A typical example is anomaly detection","Two subcategories are classification and regression","Linear regression is not an example"],c:2,e:"Supervised learning ada dua subcategory utama: classification dan regression."},
{q:"Which of the 4 are used for Data Manipulation?<br><br>Consider the following list:<br>I. Tidyverse<br>II. Pandas<br>III. Scikit-learn<br>IV. Scipy",o:["I & II","I & III","II & III","III & IV"],c:0,e:"Tidyverse (R) dan Pandas (Python) adalah library untuk data manipulation. Scikit-learn dan Scipy lebih fokus kat machine learning/scientific computing."},
{q:"For what type of data is it clear that it is Personally Identifiable Information (PII)?",o:["Favorite Hotel","Hobbies","Home Address","Education Institute"],c:2,e:"Home address terus boleh identify seseorang secara spesifik, so ia clearly PII. Hobbies/favorite hotel lagi general dan tak semestinya identify individu."},
{q:"Which of the following is <b>NOT</b> an application of Computer Vision?",o:["Facial Recognition","Augmented Reality","Conversational User Interface","Self-Driving Cars"],c:2,e:"Conversational User Interface (chatbot) adalah application Natural Language Processing, bukan Computer Vision."},
{q:"Which of the types of data analytics answer 'what is likely to happen in the future'?<br><br>I. Diagnostic<br>II. Predictive<br>III. Prescriptive",o:["I & II","II & III","II","III"],c:2,e:"Predictive analytics jawab soalan 'apa yang berkemungkinan jadi pada masa depan' — beza dengan diagnostic (kenapa dah jadi) dan prescriptive (apa patut buat pasal tu)."},
{q:"Which branch of mathematics would you use to answer the following question?<br><br>'If you toss a coin 10 times and you get 10 heads, is the coin fair?'",o:["Statistics","Geometry","Algebra","Probability"],c:0,e:"Nak test sama ada coin tu fair based on observed data (10 heads dari 10 lambungan) adalah soalan statistical inference — bukan probability semata-mata."},
{q:"Which main phase of Data Analytics comes before Data Understanding in the CRISP-DM model?",o:["Business Understanding","Setting up your environment","Modeling","Collect Initial Data"],c:0,e:"Business Understanding adalah phase pertama dalam CRISP-DM, sebelum Data Understanding."},

{q:"In differential privacy, the amount of variation caused by adding noise is configurable through a parameter called epsilon. Imagine that you are developing a model to predict the gender based on different measures of bone remains (like longitude, thickness, ...). To ensure data anonymization, you apply differential privacy and these are the results:<div class='q-table-wrap'><table class='q-table'><tr><th></th><th>Exact avg (mm)</th><th>Anonymized avg (mm)</th></tr><tr><td>Female</td><td>104.93</td><td>102.71</td></tr><tr><td>Male</td><td>113.65</td><td>118.33</td></tr></table></div>Which of the following is the <b>MOST</b> compatible value of epsilon applied in the anonymization process?",o:["0","0.1","100","1000"],c:1,e:"Epsilon kecil = lebih banyak noise ditambah (privacy tinggi, utility rendah); epsilon besar = kurang noise (utility tinggi, privacy rendah). Sebab nilai anonymized dalam data ni masih cukup dekat dengan exact value tapi ada beza yang meaningful, epsilon = 0.1 (nilai biasa untuk 'strong privacy' dalam DP) paling sesuai berbanding 100/1000 yang nyaris takde noise."},

const DATA = {
  "found-a": { label:"Set A", category:"Data Foundation", cls:"foundation", questions: foundationA },
  "found-b": { label:"Set B", category:"Data Foundation", cls:"foundation", questions: foundationB },
  "an-a":    { label:"Set A", category:"Data Analyst", cls:"analyst", questions: analystA },
  "an-b":    { label:"Set B", category:"Data Analyst", cls:"analyst", questions: analystB }
};

/* =========================================================
   APP STATE + LOGIC
   ========================================================= */
let state = { screen:"home", setKey:null, qi:0, score:0, locked:false, selected:null, wrong:[], reviewOpen:false };

function resetRun(){ state.qi=0; state.score=0; state.locked=false; state.selected=null; state.wrong=[]; state.reviewOpen=false; }
function goHome(){ state.screen="home"; state.setKey=null; resetRun(); render(); }
function startSet(key){ state.screen="quiz"; state.setKey=key; resetRun(); render(); window.scrollTo(0,0); }
function retrySet(){ startSet(state.setKey); }

function selectOpt(i){
  if(state.locked) return;
  state.locked = true;
  state.selected = i;
  const q = DATA[state.setKey].questions[state.qi];
  if(i === q.c){ state.score++; }
  else { state.wrong.push({ q: q.q, your: q.o[i], correct: q.o[q.c], e: q.e }); }
  render();
}

function nextQ(){
  const total = DATA[state.setKey].questions.length;
  if(state.qi + 1 >= total){ state.screen="result"; render(); window.scrollTo(0,0); return; }
  state.qi++; state.locked=false; state.selected=null; render(); window.scrollTo(0,0);
}

function toggleReview(){ state.reviewOpen = !state.reviewOpen; render(); }

document.addEventListener("keydown", (e)=>{
  if(state.screen !== "quiz") return;
  const k = e.key;
  if(!state.locked && ["1","2","3","4"].includes(k)){
    selectOpt(parseInt(k,10)-1);
  } else if(state.locked && (k==="Enter" || k===" ")){
    e.preventDefault(); nextQ();
  }
});

function esc(s){ return s; } // content is trusted (authored), HTML allowed for tables/formatting

function render(){
  const root = document.getElementById("app");
  if(state.screen==="home") root.innerHTML = viewHome();
  else if(state.screen==="quiz") root.innerHTML = viewQuiz();
  else root.innerHTML = viewResult();
  attachHandlers();
}

function viewHome(){
  let cards = "";
  for(const key in DATA){
    const s = DATA[key];
    cards += `
      <div class="set-card ${s.cls}">
        <span class="cat">${s.category}</span>
        <h3>${s.label}</h3>
        <span class="count">${s.questions.length} soalan</span>
        <button class="go-btn" data-start="${key}">Mula &rarr;</button>
      </div>`;
  }
  return `
    <div class="brand">
      <div class="stamp-mini">DS</div>
      <div class="brand-text">
        <p class="eyebrow">Pusat Semakan</p>
        <h1>Data Foundation &amp; Data Analyst</h1>
      </div>
    </div>
    <p class="home-intro">Pilih set yang nak diulangkaji. Setiap soalan akan bagi jawapan &amp; penerangan serta-merta lepas kau jawab, dan markah penuh keluar di hujung set.</p>
    <div class="set-grid">${cards}</div>
    <p class="footnote">Sumber soalan: PDF exam review yang kau upload &middot; dijana semula sebagai latihan interaktif</p>
  `;
}

function viewQuiz(){
  const set = DATA[state.setKey];
  const total = set.questions.length;
  const q = set.questions[state.qi];
  const pct = Math.round(((state.qi)/total)*100);

  let optsHtml = "";
  const letters = ["A","B","C","D"];
  q.o.forEach((opt, i)=>{
    if(opt === "") return;
    let cls = "opt";
    let mark = "";
    if(state.locked){
      cls += " locked";
      if(i === q.c){ cls += " correct stamp-pop"; mark = "&#10003;"; }
      else if(i === state.selected){ cls += " wrong stamp-pop"; mark = "&#10007;"; }
      else { cls += " dim"; }
    }
    optsHtml += `
      <button class="${cls}" data-opt="${i}" ${state.locked?"disabled":""}>
        <span class="letter">${letters[i]}</span>
        <span class="otext">${opt}</span>
        ${mark ? `<span class="mark-icon">${mark}</span>` : ""}
      </button>`;
  });

  let feedback = "";
  let note = "";
  let nextBtn = "";
  if(state.locked){
    const isCorrect = state.selected === q.c;
    feedback = `<div class="feedback-banner ${isCorrect?"good":"bad"}">${isCorrect ? "&#10003; Betul!" : "&#10007; Belum tepat"}</div>`;
    note = `<div class="note"><span class="note-label">Penerangan</span>${q.e}</div>`;
    const isLast = state.qi + 1 >= total;
    nextBtn = `<div class="next-row"><button class="next-btn" id="nextBtn">${isLast ? "Lihat Markah" : "Seterusnya"} &rarr; <span class="kbd-hint">(Enter)</span></button></div>`;
  }

  return `
    <div class="quiz-top">
      <button class="back-link" id="backBtn">&larr; Set</button>
      <div class="progress-wrap">
        <div class="progress-label"><span>${set.category} — ${set.label}</span><span>Soalan ${state.qi+1} / ${total}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="score-badge">${state.score} / ${total}</div>
    </div>
    <div class="q-card">
      <p class="q-text">${q.q}</p>
      <div class="options">${optsHtml}</div>
      ${feedback}
      ${note}
    </div>
    ${nextBtn}
  `;
}

function viewResult(){
  const set = DATA[state.setKey];
  const total = set.questions.length;
  const score = state.score;
  const pct = Math.round((score/total)*100);

  let tier, stampColor;
  if(pct >= 90){ tier = "Cemerlang! Betul-betul dah master topik ni."; stampColor = "var(--green-pen)"; }
  else if(pct >= 70){ tier = "Bagus — tinggal sikit lagi nak solid sepenuhnya."; stampColor = "var(--teal)"; }
  else if(pct >= 50){ tier = "Okay, tapi ada beberapa topik patut diulangkaji balik."; stampColor = "var(--gold)"; }
  else { tier = "Jangan risau — ni sebab tu kita ulangkaji. Cuba lagi sekali."; stampColor = "var(--red-pen)"; }

  let reviewHtml = "";
  if(state.wrong.length > 0){
    reviewHtml = `<button class="review-toggle" id="reviewToggle">${state.reviewOpen ? "Sembunyikan" : "Semak balik"} ${state.wrong.length} soalan yang tersalah &darr;</button>`;
    if(state.reviewOpen){
      let items = "";
      state.wrong.forEach(w=>{
        items += `
          <div class="review-item">
            <p class="rq">${w.q}</p>
            <p class="ra you">Jawapan kau: ${w.your}</p>
            <p class="ra correct">Jawapan betul: ${w.correct}</p>
            <p class="re">${w.e}</p>
          </div>`;
      });
      reviewHtml += `<div class="review-list">${items}</div>`;
    }
  } else {
    reviewHtml = `<p style="color:#dce9e5;font-size:.9rem;">Semua soalan betul — takde yang perlu disemak balik!</p>`;
  }

  return `
    <div class="result-wrap">
      <div class="stamp-big" style="--stampcolor:${stampColor}">
        <span class="score-num">${score}/${total}</span>
        <span class="score-pct">${pct}%</span>
      </div>
      <p class="result-msg">${tier}</p>
      <p class="result-sub">${set.category} &middot; ${set.label}</p>
      <div class="result-actions">
        <button class="btn-solid" id="retryBtn">Cuba Lagi Set Ni</button>
        <button class="btn-ghost" id="homeBtn">Pilih Set Lain</button>
      </div>
      ${reviewHtml}
    </div>
  `;
}

function attachHandlers(){
  document.querySelectorAll("[data-start]").forEach(btn=>{
    btn.addEventListener("click", ()=> startSet(btn.getAttribute("data-start")));
  });
  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.addEventListener("click", goHome);
  document.querySelectorAll("[data-opt]").forEach(btn=>{
    btn.addEventListener("click", ()=> selectOpt(parseInt(btn.getAttribute("data-opt"),10)));
  });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", nextQ);
  const retryBtn = document.getElementById("retryBtn");
  if(retryBtn) retryBtn.addEventListener("click", retrySet);
  const homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", goHome);
  const reviewToggle = document.getElementById("reviewToggle");
  if(reviewToggle) reviewToggle.addEventListener("click", toggleReview);
}

render();
</script>
</body>
</html>
